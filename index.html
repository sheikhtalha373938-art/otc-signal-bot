<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTC Signal Board</title>

<style>
* {
  box-sizing: border-box;
}

body {
  background: #0b1220;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 15px;
}

.board {
  max-width: 450px;
  margin: 20px auto;
  background: #172338;
  padding: 22px;
  border-radius: 18px;
  border: 1px solid #334155;
}

h1 {
  color: #00e5ff;
}

select, button {
  width: 90%;
  padding: 14px;
  margin: 9px;
  border: none;
  border-radius: 9px;
  font-size: 17px;
}

select {
  background: #334155;
  color: white;
}

.signal {
  font-size: 42px;
  font-weight: bold;
  margin: 25px;
  color: #facc15;
}

.generate {
  background: #0891b2;
  color: white;
}

.ok {
  background: #16a34a;
  color: white;
}

.status {
  color: #94a3b8;
  font-size: 13px;
  line-height: 1.6;
}
</style>
</head>

<body>

<div class="board">

<h1>OTC SIGNAL BOT</h1>
<h3>1 MINUTE TIMEFRAME</h3>

<select id="pair">
  <option>EUR/USD OTC</option>
  <option>GBP/USD OTC</option>
  <option>USD/JPY OTC</option>
  <option>AUD/USD OTC</option>
  <option>USD/CHF OTC</option>
  <option>EUR/GBP OTC</option>
</select>

<div class="signal" id="signal">WAIT</div>

<p id="timer">Ready</p>

<button class="generate" onclick="generateSignal()">
GET SIGNAL
</button>

<button class="ok" onclick="confirmSignal()">
OK
</button>

<p class="status" id="status">
DEMO MODE<br>
No live market data connected
</p>

</div>

<script>

let currentSignal = "WAIT";

function generateSignal() {

  currentSignal = "WAIT";

  document.getElementById("signal").innerText =
    currentSignal;

  document.getElementById("signal").style.color =
    "#facc15";

  document.getElementById("timer").innerText =
    "Signal calculation unavailable";

  document.getElementById("status").innerText =
    "Demo mode: Live OTC data is not connected.";

}

function confirmSignal() {

  document.getElementById("status").innerText =
    "Confirmed: " + currentSignal +
    " | Demo Mode";

}

</script>

</body>
</html>
